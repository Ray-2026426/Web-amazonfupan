name: 探测产品接口（一次性）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 列出产品管理相关工具与字段
        env:
          LINGXING_MCP_KEY: ${{ secrets.LINGXING_MCP_KEY }}
        run: node scripts/probe-products.mjs
