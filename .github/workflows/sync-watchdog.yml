name: 同步漏跑自愈

# GitHub 的定时任务会延迟甚至整次跳过（实测漏过 08:10 那次）。
# 这个看门狗每天检查一次：云端最新数据没覆盖到昨天，就把缺失日期写进补数队列，
# 由「补数队列消费」工作流接手，不需要人工发现。
on:
  schedule:
    - cron: '30 1 * * *' # 北京时间 09:30
  workflow_dispatch:

concurrency:
  group: lingxing-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查最新数据日期并补齐缺口
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/sync/watchdog.mjs
