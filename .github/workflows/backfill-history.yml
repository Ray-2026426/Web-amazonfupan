name: 历史数据回补

# 用途：把 2025-01-01 以来的历史日数据补进 Supabase。
# 为什么单独一个工作流：日常同步一次只跑 1~3 天，而历史回补按现有速度
# 约 2~4 分钟/天，一次跑 297 天会远超 GitHub Actions 单次 120 分钟上限。
# 这里把区间切成若干小块，用 matrix 顺序执行，每块一个独立任务。
#
# 触发：Actions →「历史数据回补」→ Run workflow，或看板「数据质量」页一键补数
#   dates       指定日期，逗号分隔（优先；用于补单个/多选日期）
#   from        起始日期
#   to          留空 = 昨天
#   chunk_days  每块天数，默认 14（约 40~60 分钟，留足余量）
#   max_parallel 同时几个，默认 1（领星限流，调大容易 429）
on:
  workflow_dispatch:
    inputs:
      dates:
        description: '指定日期，逗号分隔（如 2026-10-02,2026-10-05；优先于 from/to）'
        required: false
        default: ''
      from:
        description: '起始日期 YYYY-MM-DD（用 dates 时可留空）'
        required: false
        default: '2025-01-01'
      to:
        description: '结束日期 YYYY-MM-DD（留空 = 昨天）'
        required: false
        default: ''
      chunk_days:
        description: '每块天数（默认 14，建议 7~21）'
        required: false
        default: '14'
      max_parallel:
        description: '同时运行的任务数（默认 1，避免领星 429）'
        required: false
        default: '1'

concurrency:
  group: lingxing-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 切分日期区间
        id: plan
        env:
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_TO: ${{ github.event.inputs.to }}
          INPUT_DATES: ${{ github.event.inputs.dates }}
          INPUT_CHUNK: ${{ github.event.inputs.chunk_days }}
        run: |
          set -euo pipefail
          CHUNK="${INPUT_CHUNK:-14}"
          TO="${INPUT_TO:-$(date -u -d 'yesterday' +%F)}"
          if [ -n "${INPUT_DATES:-}" ]; then
            chunks=$(node scripts/sync/plan-chunks.mjs --dates "$INPUT_DATES" --chunk "$CHUNK")
            label="指定日期（$INPUT_DATES）"
          else
            chunks=$(node scripts/sync/plan-chunks.mjs --from "${INPUT_FROM:-2025-01-01}" --to "$TO" --chunk "$CHUNK")
            label="${INPUT_FROM:-2025-01-01} ~ $TO"
          fi
          count=$(node -e 'console.log(JSON.parse(process.argv[1]).length)' "$chunks")

          # matrix 任务数上限，避免误输入产生上百个 job
          if [ "$count" -gt 60 ]; then
            echo "::error::$count 个任务超过上限 60，请减少日期或把 chunk_days 调大"; exit 1
          fi

          echo "共 $count 个任务：$label（每块最多 $CHUNK 天）"
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          echo "total=$count" >> "$GITHUB_OUTPUT"

  backfill:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel || '1') }}
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    name: 回补 ${{ matrix.chunk.from }} ~ ${{ matrix.chunk.to }}

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步这一段（领星 → Supabase）
        env:
          LINGXING_MCP_KEY: ${{ secrets.LINGXING_MCP_KEY }}
          LINGXING_CURRENCY: ${{ vars.LINGXING_CURRENCY || 'USD' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHUNK_FROM: ${{ matrix.chunk.from }}
          CHUNK_TO: ${{ matrix.chunk.to }}
        run: |
          set -uo pipefail
          echo "同步 $CHUNK_FROM ~ $CHUNK_TO"
          # 领星偶发 429 / 网络抖动会让整块失败；整块是幂等的（按天原子替换），
          # 所以这里自动重试一次，仍失败才真的判失败。
          attempt=1
          until node scripts/sync/run.mjs --from "$CHUNK_FROM" --to "$CHUNK_TO" --upload; do
            if [ "$attempt" -ge 2 ]; then
              echo "::error title=回补失败::$CHUNK_FROM ~ $CHUNK_TO 连续 2 次失败"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "第 $attempt 次尝试：等待 90 秒后重跑 $CHUNK_FROM ~ $CHUNK_TO"
            sleep 90
          done

      - name: 记录失败（便于事后补跑）
        if: failure()
        env:
          CHUNK_FROM: ${{ matrix.chunk.from }}
          CHUNK_TO: ${{ matrix.chunk.to }}
        run: |
          echo "::error title=回补失败::$CHUNK_FROM ~ $CHUNK_TO 失败，修好后单独重跑这一段即可"
