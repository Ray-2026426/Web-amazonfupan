name: 历史数据回补

# 用途：把 2025-01-01 以来的历史日数据补进 Supabase。
# 为什么单独一个工作流：日常同步一次只跑 1~3 天，而历史回补按现有速度
# 约 2~4 分钟/天，一次跑 297 天会远超 GitHub Actions 单次 120 分钟上限。
# 这里把区间切成若干小块，用 matrix 顺序执行，每块一个独立任务。
#
# 触发：Actions →「历史数据回补」→ Run workflow
#   from        2025-01-01
#   to          留空 = 昨天
#   chunk_days  每块天数，默认 14（约 40~60 分钟，留足余量）
#   max_parallel 同时几个，默认 1（领星限流，调大容易 429）
on:
  workflow_dispatch:
    inputs:
      from:
        description: '起始日期 YYYY-MM-DD'
        required: true
        default: '2025-01-01'
      to:
        description: '结束日期 YYYY-MM-DD（留空 = 昨天）'
        required: false
        default: ''
      chunk_days:
        description: '每块天数（默认 14，建议 7~21）'
        required: false
        default: '14'
      max_parallel:
        description: '同时运行的任务数（默认 1，避免领星 429）'
        required: false
        default: '1'

concurrency:
  group: lingxing-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: 切分日期区间
        id: plan
        env:
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_TO: ${{ github.event.inputs.to }}
          INPUT_CHUNK: ${{ github.event.inputs.chunk_days }}
        run: |
          set -euo pipefail
          FROM="${INPUT_FROM:-2025-01-01}"
          TO="${INPUT_TO:-$(date -u -d 'yesterday' +%F)}"
          CHUNK="${INPUT_CHUNK:-14}"
          if ! [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::日期格式应为 YYYY-MM-DD"; exit 1
          fi
          if [[ "$FROM" > "$TO" ]]; then echo "::error::起始日期晚于结束日期"; exit 1; fi
          if ! [[ "$CHUNK" =~ ^[0-9]+$ ]] || [ "$CHUNK" -lt 1 ] || [ "$CHUNK" -gt 31 ]; then
            echo "::error::chunk_days 应为 1~31"; exit 1
          fi

          chunks="["
          cursor="$FROM"
          count=0
          while :; do
            end=$(date -u -d "$cursor + $((CHUNK - 1)) days" +%F)
            if [[ "$end" > "$TO" ]]; then end="$TO"; fi
            chunks+="{\"from\":\"$cursor\",\"to\":\"$end\"},"
            count=$((count + 1))
            if [[ "$end" == "$TO" ]]; then break; fi
            cursor=$(date -u -d "$end + 1 day" +%F)
          done
          chunks="${chunks%,}]"

          # matrix 任务数上限，避免误输入产生上百个 job
          if [ "$count" -gt 60 ]; then
            echo "::error::$count 个任务超过上限 60，请把 chunk_days 调大"; exit 1
          fi

          echo "共 $count 个任务，区间 $FROM ~ $TO，每块 $CHUNK 天"
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          echo "total=$count" >> "$GITHUB_OUTPUT"

  backfill:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel || '1') }}
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    name: 回补 ${{ matrix.chunk.from }} ~ ${{ matrix.chunk.to }}

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步这一段（领星 → Supabase）
        env:
          LINGXING_MCP_KEY: ${{ secrets.LINGXING_MCP_KEY }}
          LINGXING_CURRENCY: ${{ vars.LINGXING_CURRENCY || 'USD' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHUNK_FROM: ${{ matrix.chunk.from }}
          CHUNK_TO: ${{ matrix.chunk.to }}
        run: |
          set -uo pipefail
          echo "同步 $CHUNK_FROM ~ $CHUNK_TO"
          # 领星偶发 429 / 网络抖动会让整块失败；整块是幂等的（按天原子替换），
          # 所以这里自动重试一次，仍失败才真的判失败。
          attempt=1
          until node scripts/sync/run.mjs --from "$CHUNK_FROM" --to "$CHUNK_TO" --upload; do
            if [ "$attempt" -ge 2 ]; then
              echo "::error title=回补失败::$CHUNK_FROM ~ $CHUNK_TO 连续 2 次失败"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "第 $attempt 次尝试：等待 90 秒后重跑 $CHUNK_FROM ~ $CHUNK_TO"
            sleep 90
          done

      - name: 记录失败（便于事后补跑）
        if: failure()
        env:
          CHUNK_FROM: ${{ matrix.chunk.from }}
          CHUNK_TO: ${{ matrix.chunk.to }}
        run: |
          echo "::error title=回补失败::$CHUNK_FROM ~ $CHUNK_TO 失败，修好后单独重跑这一段即可"
