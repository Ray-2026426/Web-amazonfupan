name: Quality gate
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 钉死版本：与本地生成 pnpm-lock.yaml 时使用的 pnpm 保持一致。
          # 只写 11 会装到不同的 minor，lockfile 解释差异会让 CI 在 install 阶段失败。
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
