name: 领星数据自动同步

# 每天北京时间 08:10（= UTC 00:10）拉取前几天的数据并写入数据库。
# 电脑关机也照跑：任务在 GitHub 的机器上执行。
#
# 三种触发方式：
#   1. 定时（每天 08:10）
#   2. 手动（Actions → Run workflow，可指定 days / from / to）
#   3. 提交 sync-trigger.txt（用于让协助者/脚本远程触发，跑 1 天）
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '补几天（默认 3，最多 90）'
        required: false
        default: '3'
      from:
        description: '起始日期 YYYY-MM-DD（留空则按 days 自动算）'
        required: false
        default: ''
      to:
        description: '结束日期 YYYY-MM-DD（留空则按 days 自动算）'
        required: false
        default: ''
      selfcheck:
        description: '只做配置自检（true / false）。默认 false；自检会额外调一次领星鉴权'
        required: false
        default: 'false'
  push:
    paths:
      - 'sync-trigger.txt'

concurrency:
  group: lingxing-sync
  cancel-in-progress: false

permissions:
  contents: write # 需要把同步摘要提交回仓库（保持仓库活跃 + 让结果可追溯）
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置自检（可选，默认关闭）
        # 只在手动触发且 selfcheck=true 时执行。
        # 为什么默认关闭：自检本身会做一次领星鉴权，紧接着的同步再鉴权，
        # 短时间内两次鉴权容易触发领星的 429「认证请求过于频繁」。
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.selfcheck == 'true'
        continue-on-error: true
        env:
          LINGXING_MCP_KEY: ${{ secrets.LINGXING_MCP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/sync/selfcheck.mjs

      - name: 同步（领星 → 数据库）
        env:
          LINGXING_MCP_KEY: ${{ secrets.LINGXING_MCP_KEY }}
          LINGXING_CURRENCY: ${{ vars.LINGXING_CURRENCY || 'USD' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_TO: ${{ github.event.inputs.to }}
        run: |
          set -euo pipefail
          if [ -z "${LINGXING_MCP_KEY:-}" ]; then
            echo "::error title=缺少密钥::缺少 LINGXING_MCP_KEY"
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error title=缺少密钥::缺少 SUPABASE_URL 或 SUPABASE_SECRET_KEY"
            exit 1
          fi
          # push 触发（提交 sync-trigger.txt）默认只跑 1 天；
          # 想补历史就在该文件里写一行 `run: days=30` 或 `run: from=2026-09-01 to=2026-09-30`
          # —— 只认 `run:` 开头的行，避免说明文字里的示例被误当成参数
          DAYS="${INPUT_DAYS:-}"
          FROM="${INPUT_FROM:-}"
          TO="${INPUT_TO:-}"
          if [ "${EVENT_NAME}" = "push" ]; then
            if [ -f sync-trigger.txt ]; then
              # 只认「行首就是 run:」的那一行，避免说明文字/缩进示例被误当参数
              RUNLINE=$(grep -E '^run:' sync-trigger.txt | head -1 || true)
              if [ -n "$RUNLINE" ]; then
                t=$(printf '%s' "$RUNLINE" | grep -oE 'days=[0-9]+' | head -1 | cut -d= -f2 || true)
                if [ -n "$t" ]; then DAYS="$t"; fi
                t=$(printf '%s' "$RUNLINE" | grep -oE 'from=[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d= -f2 || true)
                if [ -n "$t" ]; then FROM="$t"; fi
                t=$(printf '%s' "$RUNLINE" | grep -oE 'to=[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d= -f2 || true)
                if [ -n "$t" ]; then TO="$t"; fi
              fi
            fi
            if [ -z "$DAYS" ] && [ -z "$FROM" ]; then DAYS=1; fi
          fi
          # 定时任务不写死 1 天：留空交给 sync_settings.lookback_days（默认 3 天，
          # 可在看板「数据管理」里调 1~14）。这样某天同步失败，后一天的运行会自动
          # 把缺口一起补上，不会像之前那样留下永久空洞。
          if [ "${EVENT_NAME}" = "schedule" ]; then DAYS=""; fi
          if [ -n "${FROM:-}" ] && [ -n "${TO:-}" ]; then
            node scripts/sync/run.mjs --from "$FROM" --to "$TO" --out data/snapshot --upload
          elif [ -n "$DAYS" ]; then
            node scripts/sync/run.mjs --days "$DAYS" --out data/snapshot --upload
          else
            node scripts/sync/run.mjs --out data/snapshot --upload
          fi

      - name: 记录失败原因（供事后排查 / 让结果可追溯）
        if: failure()
        run: |
          mkdir -p data/snapshot/runs
          ts=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          cat > "data/snapshot/runs/failed-${ts}.json" <<EOF
          {
            "status": "failed",
            "at": "${ts}",
            "event": "${EVENT_NAME}",
            "runId": "${GITHUB_RUN_ID}",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          echo "已记录失败摘要"
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: 提交同步摘要（保持仓库活跃，避免定时任务 60 天被自动停用）
        if: always()
        continue-on-error: true # 摘要提交是辅助功能，失败不应该把成功的同步标记成失败
        run: |
          set -e
          if [ ! -d data/snapshot ]; then
            echo "没有摘要文件，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot/manifest.json data/snapshot/runs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "摘要没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(sync): 同步摘要 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 别人可能同时在改仓库，先 rebase 再推
          git pull --rebase --autostash origin main || true
          git push

      - name: 保存审计日志（不含业务数据）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_id }}
          path: |
            data/snapshot/manifest.json
            data/snapshot/runs/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: 失败时开 Issue 提醒
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `领星同步失败 ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '自动同步任务失败了，看板会继续显示上一次成功的数据。',
              '',
              `运行日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '常见原因：',
              '- 领星 MCP 密钥过期或权限被改（先跑「领星连通性测试」看是否 102）',
              '- 领星鉴权被限流（429），等 30~60 分钟再试',
              '- Supabase 密钥/URL 配错，或数据库配额满',
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
