<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telos · 业绩诊断</title>
    <script>
      // 先于 React 挂载读取主题，避免刷新瞬间出现「白闪」
      (function () {
        try {
          var t = localStorage.getItem('app_theme');
          if (t === 'dark' || (t == null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- 关键底色内联，防止样式包加载前出现白屏闪烁（完整样式由 index.tsx 注入） -->
    <style>
      html { background-color: #f8fafc; }
      html.dark { background-color: #0d1117; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
